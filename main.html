<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Money Trucks</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }

        /* Floating Audio Control at top right of the app shell */
        #audio-shell-bar {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 99999;
        }

        .audio-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            width: 40px;
            height: 40px;
            backdrop-filter: blur(5px);
        }

        /* Fullscreen App Frame */
        #app-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Persistent Global Audio Toggle Button -->
    <div id="audio-shell-bar">
        <button id="audio-toggle-btn" class="audio-btn" aria-label="Toggle Audio">
            <svg id="volume-icon-on" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
            <svg id="volume-icon-off" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
            </svg>
        </button>
    </div>

    <!-- The actual game view -->
    <iframe id="app-frame" src="index.html"></iframe>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const userId = tg?.initDataUnsafe?.user?.id || 12345;

        // Persistent Audio Engine
        const truckEngineSound = new Audio('sounds/truck_running.mp3');
        truckEngineSound.loop = true;
        truckEngineSound.volume = 0.5;

        const volumeIconOn = document.getElementById('volume-icon-on');
        const volumeIconOff = document.getElementById('volume-icon-off');
        const audioToggleBtn = document.getElementById('audio-toggle-btn');

        let isAudioMuted = localStorage.getItem(`audio_muted_${userId}`) === "true";

        function updateAudioUI() {
            if (isAudioMuted) {
                volumeIconOn.style.display = 'none';
                volumeIconOff.style.display = 'block';
            } else {
                volumeIconOn.style.display = 'block';
                volumeIconOff.style.display = 'none';
            }
        }

        function toggleAudio() {
            isAudioMuted = !isAudioMuted;
            localStorage.setItem(`audio_muted_${userId}`, isAudioMuted ? "true" : "false");
            
            if (isAudioMuted) {
                truckEngineSound.pause();
            } else {
                truckEngineSound.play().catch(e => console.warn("Audio blocked:", e));
            }
            updateAudioUI();
        }

        audioToggleBtn.addEventListener('click', toggleAudio);

        // Auto-start sound on user interaction
        function initAudioOnTouch() {
            updateAudioUI();
            if (!isAudioMuted) {
                truckEngineSound.play().catch(e => console.warn("Waiting for interaction:", e));
            }
        }

        document.addEventListener('click', initAudioOnTouch, { once: true });
        document.addEventListener('touchstart', initAudioOnTouch, { once: true });

        // Pause sound when user minimizes Telegram
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                truckEngineSound.pause();
            } else if (!isAudioMuted) {
                truckEngineSound.play().catch(e => console.warn("Resume blocked:", e));
            }
        });
    </script>
</body>
</html>
